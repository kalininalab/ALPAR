# HTCondor-owned containers, not nested Snakemake/Apptainer deployment.
# Requires shared filesystem bind mounts and a worker with script dependencies.
# Read ../../containers/README.md before submitting jobs.
# SIC Cluster Docker-universe settings from the local HTCondor introduction.
executor: htcondor
cores: 32
local-cores: 2
# Remote execution requires a positive job limit; one group at a time.
jobs: 10

group-components:
  snippy_batch: 2000
  prokka_batch: 2000

resources:
  mem_mb: 32000

set-resource-scopes:
  mem_mb: global

configfile: ../../config/config.yaml

htcondor-jobdir: .snakemake/htcondor

default-resources:
  universe: docker
  container_image: docker.io/cambouu/alpar-smk-python313:1.0.0
  job_wrapper: snakefiles/containers/htcondor-wrapper.sh
  # Snakemake mem_mb is decimal MB; HTCondor's MB suffix means MiB.
  # The plugin's htcondor_request_mem_mb uses HTCondor's binary units.
  mem_mb: 8000
  htcondor_request_mem_mb: 7630
  request_disk: 128GB
  requirements: 'UidDomain == "cs.uni-saarland.de"'
  classad_WantGPUHomeMounted: true

set-resources:
  phenotype_dataframe_creator:
    mem_mb: 4000
    htcondor_request_mem_mb: 3815
    container_image: docker.io/cambouu/alpar-smk-python313:1.0.0
  cd_hit_create_db:
    mem_mb: 2000
    htcondor_request_mem_mb: 1908
    container_image: docker.io/cambouu/alpar-smk-cd-hit:1.0.0
  makeblastdb:
    mem_mb: 1000
    htcondor_request_mem_mb: 954
    container_image: docker.io/cambouu/alpar-smk-makeblastdb:1.0.0
  prokka_listdb:
    mem_mb: 1000
    htcondor_request_mem_mb: 954
    container_image: docker.io/cambouu/alpar-smk-prokka:1.0.0
  prokka_runner:
    mem_mb: 8000
    htcondor_request_mem_mb: 7630
    container_image: docker.io/cambouu/alpar-smk-prokka:1.0.0
  mashtree_runner:
    mem_mb: 1000
    htcondor_request_mem_mb: 954
    container_image: docker.io/cambouu/alpar-smk-mashtree:1.0.0
  mash_sketch:
    mem_mb: 1000
    htcondor_request_mem_mb: 954
    container_image: docker.io/cambouu/alpar-smk-datasail:1.0.0
  mash_dist:
    mem_mb: 1000
    htcondor_request_mem_mb: 954
    container_image: docker.io/cambouu/alpar-smk-datasail:1.0.0
  datasail_pre_processor:
    mem_mb: 1000
    htcondor_request_mem_mb: 954
    container_image: docker.io/cambouu/alpar-smk-miller:1.0.0
  datasail_runner:
    mem_mb: 1000
    htcondor_request_mem_mb: 954
    container_image: docker.io/cambouu/alpar-smk-datasail:1.0.0
  split_phenotype_dataframe:
    mem_mb: 1000
    htcondor_request_mem_mb: 954
    container_image: docker.io/cambouu/alpar-smk-miller:1.0.0
  snippy_runner:
    # 32 x 1000 MB in Snakemake; 954 MiB per sample in HTCondor.
    htcondor_request_mem_mb: 954
    container_image: docker.io/cambouu/alpar-smk-snippy:1.0.0
  annotation_file_from_snippy:
    mem_mb: 4000
    htcondor_request_mem_mb: 3815
