# HTCondor-owned containers, not nested Snakemake/Apptainer deployment.
# Requires shared filesystem bind mounts and a worker with script dependencies.
# Read ../../containers/README.md before submitting jobs.
# SIC Cluster Docker-universe settings from the local HTCondor introduction.
executor: htcondor
# Cluster-wide CPU scheduling budget; rules without threads: use Snakemake's one-thread default.
cores: 16
# Cap shell-only jobs on the Snakemake host.
local-cores: 2
jobs: 100
# The per-sample rules define these groups; batch up to 100 samples per HTCondor job.
group-components:
  snippy_batch: 100
  prokka_batch: 100
# Aggregate scheduling budget; rule allocations remain integer MB.
resources:
  mem_mb: 32000
set-resource-scopes:
  mem_mb: global
# Resolved relative to this profile directory.
configfile: ../../config/config.yaml
# Omit --sdm: its default is no deployment; an empty YAML list is not valid CLI syntax.
htcondor-jobdir: .snakemake/htcondor
default-resources:
  universe: docker
  container_image: docker.io/cambouu/alpar-smk-python313:1.0.0
  job_wrapper: snakefiles/containers/htcondor-wrapper.sh
  # Per-job defaults. Numeric memory can be summed for parallel group jobs.
  mem_mb: 8192
  htcondor_request_mem_mb: 8192
  request_disk: 128GB
  requirements: 'UidDomain == "cs.uni-saarland.de"'
  classad_WantGPUHomeMounted: true
set-resources:
  phenotype_dataframe_creator:
    mem_mb: 1024
    htcondor_request_mem_mb: 1024
    container_image: docker.io/cambouu/alpar-smk-python313:1.0.0
