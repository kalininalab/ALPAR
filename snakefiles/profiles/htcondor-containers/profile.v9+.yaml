# Pin measured multithreaded jobs to the tested CPU count instead of
# inheriting the 16-core workflow scheduling budget.
set-threads:
  annotation_file_from_snippy: 8
  cd_hit_create_db: 8
  cdhit_runner: 8
  mashtree_runner: 8
  panpa_build_gfa: 12
  pyseer_genotype_matrix_creator: 8
  pyseer_runner: 8
